<svg xmlns="http://www.w3.org/2000/svg" width="168" height="168" viewBox="0 0 168 168" opacity=".55">
  <defs>
    <pattern id="weave" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M.5 0v4M2.5 0v4" stroke="#536476" stroke-opacity=".16" stroke-width=".6"/>
      <path d="M0 1h4M0 3h4" stroke="#fffdf5" stroke-opacity=".3" stroke-width=".7"/>
      <path d="M.8 1v1.6m2 .4v1.6" stroke="#fffdf5" stroke-opacity=".42" stroke-width=".8"/>
    </pattern>
    <filter id="fibers" x="0" y="0" width="100%" height="100%">
